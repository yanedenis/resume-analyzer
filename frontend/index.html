<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Cloud-Native AI Resume Analyzer</h1>
        <p class="text-gray-600 mb-6">Upload your resume (PDF) to get instant AI feedback</p>

        <input type="file" id="resumeFile" accept=".pdf,application/pdf" class="mb-4 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100"/>

        <button id="analyzeBtn" onclick="uploadResume()" class="w-full bg-violet-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-violet-700 transition disabled:opacity-60 disabled:cursor-not-allowed">
            Analyze Resume
        </button>

        <!-- Progress / error line -->
        <div id="statusBox" class="mt-4 hidden items-center gap-3 text-sm" role="status" aria-live="polite">
            <svg id="spinner" width="20" height="20" class="animate-spin h-5 w-5 text-violet-600 shrink-0" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span id="statusText" class="text-gray-700"></span>
        </div>

        <!-- Results -->
        <div id="resultBox" class="mt-6 hidden bg-gray-100 p-4 rounded-lg space-y-4">
            <h3 class="font-bold text-gray-700">Analysis Results</h3>

            <div>
                <div class="flex items-baseline justify-between mb-1">
                    <span class="text-sm text-gray-600">Match score</span>
                    <span class="text-2xl font-bold text-gray-800"><span id="scoreValue">0</span><span class="text-sm text-gray-500">/100</span></span>
                </div>
                <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                    <div id="scoreBar" class="h-full bg-violet-600 rounded-full transition-all duration-700" style="width:0%"></div>
                </div>
            </div>

            <div class="text-sm text-gray-600">Experience level:
                <span id="levelValue" class="font-semibold text-gray-800"></span>
            </div>

            <div>
                <div class="text-sm text-gray-600 mb-2">Skills</div>
                <div id="skillsList" class="flex flex-wrap gap-2"></div>
            </div>

            <div>
                <div class="text-sm text-gray-600 mb-2">Improvement tips</div>
                <ol id="tipsList" class="list-decimal list-inside space-y-1 text-sm text-gray-800"></ol>
            </div>
        </div>
    </div>

    <script>
        // After `terraform apply`, run `terraform output api_url` and paste the value here.
        const API_URL = "https://cvdwe46daerjalw5mpntr4le5i0zrkbw.lambda-url.eu-north-1.on.aws/";

        const MAX_MB = 10;
        const POLL_MS = 2500;
        const TIMEOUT_MS = 150000;

        const $ = (id) => document.getElementById(id);
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const apiBase = () => API_URL.replace(/\/+$/, "");

        function setStatus(text, { error = false, busy = true } = {}) {
            $("statusBox").classList.remove("hidden");
            $("statusBox").classList.add("flex");
            $("statusText").textContent = text;
            $("statusText").className = error ? "text-red-600" : "text-gray-700";
            $("spinner").classList.toggle("hidden", !busy);
        }

        function clearStatus() {
            $("statusBox").classList.add("hidden");
            $("statusBox").classList.remove("flex");
        }

        async function api(path, options) {
            const res = await fetch(apiBase() + path, options);
            if (!res.ok) throw new Error(`Server error (${res.status})`);
            return res.json();
        }

        async function uploadResume() {
            const fileInput = $("resumeFile");
            if (fileInput.files.length === 0) {
                setStatus("Please select a PDF file first.", { error: true, busy: false });
                return;
            }
            const file = fileInput.files[0];

            if (API_URL.includes("REPLACE_ME")) {
                setStatus("Set API_URL in index.html (terraform output api_url).", { error: true, busy: false });
                return;
            }
            if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
                setStatus("Only PDF files are supported.", { error: true, busy: false });
                return;
            }
            if (file.size > MAX_MB * 1024 * 1024) {
                setStatus(`File is too large (max ${MAX_MB} MB).`, { error: true, busy: false });
                return;
            }

            $("analyzeBtn").disabled = true;
            $("resultBox").classList.add("hidden");

            try {
                setStatus("Requesting upload link…");
                const { upload_url, resume_id } = await api("/upload-url", { method: "POST" });

                setStatus("Uploading your resume…");
                const put = await fetch(upload_url, {
                    method: "PUT",
                    headers: { "Content-Type": "application/pdf" },
                    body: file,
                });
                if (!put.ok) throw new Error(`Upload failed (${put.status})`);

                setStatus("Analyzing… this usually takes 10–30 seconds.");
                const deadline = Date.now() + TIMEOUT_MS;
                while (Date.now() < deadline) {
                    await sleep(POLL_MS);
                    const data = await api(`/result?id=${encodeURIComponent(resume_id)}`);
                    if (data.status === "COMPLETED") {
                        renderResult(data.analysis);
                        clearStatus();
                        return;
                    }
                    if (data.status === "FAILED") {
                        throw new Error("Analysis failed: " + (data.error || "unknown error"));
                    }
                }
                throw new Error("Timed out waiting for the analysis. Check the Lambda logs.");
            } catch (err) {
                setStatus(err.message || String(err), { error: true, busy: false });
            } finally {
                $("analyzeBtn").disabled = false;
            }
        }

        // All model output is inserted with textContent (never innerHTML)
        function renderResult(a) {
            const score = Math.max(0, Math.min(100, Number(a.match_score) || 0));
            $("scoreValue").textContent = score;
            $("scoreBar").style.width = score + "%";
            $("levelValue").textContent = a.experience_level || "—";

            const skills = $("skillsList");
            skills.replaceChildren();
            (a.skills || []).forEach((s) => {
                const chip = document.createElement("span");
                chip.className = "px-2 py-1 text-xs rounded-full bg-violet-100 text-violet-700";
                chip.textContent = s;
                skills.appendChild(chip);
            });

            const tips = $("tipsList");
            tips.replaceChildren();
            (a.improvement_tips || []).forEach((t) => {
                const li = document.createElement("li");
                li.textContent = t;
                tips.appendChild(li);
            });

            $("resultBox").classList.remove("hidden");
        }
    </script>
</body>
</html>
